name: Flutter Widget Tests

on:
  # Run validation automatically only for this focused messaging test branch.
  push:
    branches:
      - feature/staff-messaging-attachments-2026-11-21
  workflow_dispatch:

jobs:
  widget-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run widget tests
        run: flutter test --reporter expanded
