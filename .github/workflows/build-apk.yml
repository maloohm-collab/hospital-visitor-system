name: Build APK

on:
  # بناء APK يدوي فقط عند موافقة المستخدم.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android project files
        run: flutter create --platforms=android .

      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          content = path.read_text()
          updated, count = re.subn(
              r"(?m)^\\s*compileSdk\\s*=.*$",
              "    compileSdk = 36",
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find compileSdk setting in android/app/build.gradle.kts")
          path.write_text(updated)
          print("Configured compileSdk = 36")
          PY

      - name: Configure Google Services Gradle plugin
        run: |
          sed -i '/^plugins {/a\\    id("com.google.gms.google-services") version "4.4.3" apply false' android/settings.gradle.kts
          sed -i '/^plugins {/a\\    id("com.google.gms.google-services")' android/app/build.gradle.kts

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hospital-visitor-system-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
