name: Build APK

on:
  # Manual execution only. The repository owner starts builds when ready.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android project files
        run: flutter create --platforms=android .
      - name: Apply ROCK SECURITY launcher icon and app name
        run: |
          python3 -m pip install --user pillow
          python3 - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image
          source = Path("assets/images/ROCK_SECURITY_icon.png")
          if not source.exists():
              raise SystemExit(f"Launcher icon not found: {source}")
          image = Image.open(source).convert("RGBA")
          side = min(image.width, image.height)
          left = (image.width - side) // 2
          top = (image.height - side) // 2
          image = image.crop((left, top, left + side, top + side))
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              output_dir = Path(f"android/app/src/main/res/mipmap-{density}")
              output_dir.mkdir(parents=True, exist_ok=True)
              image.resize((size, size), Image.Resampling.LANCZOS).save(output_dir / "ic_launcher.png", optimize=True)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          content, icon_count = re.subn(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', content, count=1)
          content, label_count = re.subn(r'android:label="[^"]+"', 'android:label="ROCK SECURITY"', content, count=1)
          if icon_count != 1 or label_count != 1:
              raise SystemExit("Could not update Android launcher icon or label")
          manifest.write_text(content)
          PY
      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/build.gradle.kts")
          content = path.read_text()
          updated, count = re.subn(r"(?m)^\s*compileSdk\s*=.*$", "    compileSdk = 36", content, count=1)
          if count != 1:
              raise SystemExit("Could not find compileSdk setting")
          path.write_text(updated)
          PY
      - name: Configure Android notifications and desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          for perm in ("POST_NOTIFICATIONS", "VIBRATE", "CAMERA", "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_REMOTE_MESSAGING", "WAKE_LOCK", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"):
              tag = f'<uses-permission android:name="android.permission.{perm}"/>'
              if perm not in content:
                  content = content.replace("<application", tag + "\n    <application", 1)
          legacy = '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>'
          if "WRITE_EXTERNAL_STORAGE" not in content:
              content = content.replace("<application", legacy + "\n    <application", 1)
          if "requestLegacyExternalStorage" not in content:
              content = re.sub(r"<application\b", '<application android:requestLegacyExternalStorage="true"', content, count=1)
          manifest.write_text(content)
          gradle = Path("android/app/build.gradle.kts")
          g = gradle.read_text()
          if "isCoreLibraryDesugaringEnabled" not in g:
              g, n = re.subn(r"(compileOptions\s*\{)", r"\1\n        isCoreLibraryDesugaringEnabled = true", g, count=1)
              if n != 1:
                  raise SystemExit("compileOptions block not found")
          if "desugar_jdk_libs" not in g:
              g += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          gradle.write_text(g)
          PY
      - name: Configure Google Services Gradle plugin
        run: |
          sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.3" apply false' android/settings.gradle.kts
          sed -i '/^plugins {/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
      - name: Validate Firebase Cloud Functions syntax
        run: node --check functions/index.js
      - name: Download IBM Plex Sans Arabic font assets
        run: bash tool/download_fonts.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test --reporter expanded
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hospital-visitor-system-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
