name: hospital_visitor_system
description: Arabic RTL hospital visitor management application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  arabic_reshaper: ^0.0.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.6.1
  image_picker: ^1.1.2
  gal: ^2.3.3
  firebase_app_check: ^0.4.6
  firebase_ai: ^3.15.0
  pdf: ^3.11.3
  printing: ^5.13.4
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  url_launcher: ^6.3.2
  file_picker: ^10.3.6
  flutter_secure_storage: ^9.2.4
  image: 4.5.4
  flutter_local_notifications: ^19.4.0
  flutter_foreground_task: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
  assets:
    - assets/images/welcome_screen.jpg
    - assets/images/site_manager_cutout.png
    - assets/images/login_background.jpg
    - assets/fonts/OFL.txt
